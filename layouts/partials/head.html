<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{{- if .IsHome }}
<title>{{ .Site.Params.titleBase }}</title>
{{- else }}
<title>{{ .Title }} | {{ .Site.Params.titleBase }}</title>
{{- end }}

{{ partial "seo.html" . }}

<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<meta name="google-site-verification" content="{{ .Site.Params.googleSiteVerification }}">

{{/* Google Fonts: Roboto Condensed + Source Sans Pro (cyrillic-ext) */}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=Source+Sans+Pro:wght@400;600&subset=cyrillic-ext&display=swap">

{{ define "main" }}
  <div class="bg-gray-50">
  <div class="mx-auto max-w-2xl px-6 py-12 md:py-16 lg:px-8">
    <div class="flex flex-col items-center justify-center text-center sm:py-12 md:py-24">
      <div class="w-full max-w-sm sm:max-w-md">
        {{ with resources.Get "img/404.svg" }}
          {{ .Content | safeHTML }}
        {{ end }}
      </div>
      <h1 class="mt-8 font-display text-4xl font-normal tracking-tight text-gray-900 sm:text-5xl">Сторінку не знайдено.</h1>
      <a href="/" class="mt-10 inline-block rounded-full bg-sky-500 px-8 py-3 font-semibold text-white shadow-sm transition-colors duration-200 hover:bg-sky-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-500">
        На головну
      </a>
    </div>
  </div>
  </div>
{{ end }}

[dist_subtitle]
other = "Приєднуйтесь до нашої мережі та розповсюджуйте книгу «Добро і зло» у вашій громаді"

[dist_what_heading]
other = "Що це таке?"

[dist_what_text]
other = "Християнська місія «Біблія понад усе» (Euro Team Outreach, Inc.) безкоштовно надає книгу «Добро і зло» приватним особам та організаціям в Україні з метою розповсюдження. До участі запрошуються церкви, місіонери, школи, громадські організації та окремі особи, які мають чіткий план розповсюдження."

[dist_how_heading]
other = "Як це працює"

[dist_step1_label]
other = "Зареєструйтесь"

[dist_step1_desc]
other = "Створіть обліковий запис на нашій платформі для дистриб'юторів. Реєстрація безкоштовна."

[dist_step2_label]
other = "Сплануйте подію"

[dist_step2_desc]
other = "Повідомте нам, де і як ви плануєте розповсюджувати книги — чи то на церковному служінні, вуличній євангелізації, шкільному заході чи в іншому форматі."

[dist_step3_label]
other = "Замовте книги"

[dist_step3_desc]
other = "Вкажіть, скільки книг вам потрібно для вашої події. Ми надішлемо їх через Нову Пошту або Укрпошту. Ви покриваєте лише витрати на доставку."

[dist_step4_label]
other = "Розповсюджуйте"

[dist_step4_desc]
other = "Роздайте книги на вашій події. Усі книги повинні розповсюджуватися абсолютно безкоштовно."

[dist_step5_label]
other = "Надішліть звіт"

[dist_step5_desc]
other = "Після події надішліть короткий звіт із фотографіями. Щойно ваш звіт буде подано, ви зможете планувати наступну подію та замовити нові книги."

